services:
  postgres:
    image: postgres:16-alpine
    container_name: clone-linear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linear
      POSTGRES_PASSWORD: linear_dev_password
      POSTGRES_DB: linear_clone
    ports:
      - "5432:5432"
    volumes:
      - linear_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linear -d linear_clone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  linear_postgres_data:
